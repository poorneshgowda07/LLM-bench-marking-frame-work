[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm-benchmarking"
version = "1.0.0"
description = "Production-grade LLM benchmarking and evaluation framework"
readme = "README.md"
license = {text = "MIT"}
python_requires = ">=3.10"

[project.urls]
Repository = "https://github.com/your-org/llm-benchmarking"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py310"
