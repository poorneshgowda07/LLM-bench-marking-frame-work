# Global benchmark configuration
benchmark:
  version: '1.0'
  name: LLM Benchmarking Framework
  description: Production-grade evaluation framework for LLM providers

  methodologies:
    controlled:
      temperature: 0.0
      max_tokens: 1024
      top_p: 1.0
      description: Fixed parameters for pure capability comparison
    real_world:
      temperature: 0.7
      max_tokens: 2048
      top_p: 0.95
      description: Production-like parameters for real-world simulation
    adversarial:
      temperature: 0.0
      max_tokens: 1024
      top_p: 1.0
      description: Adversarial prompts to find failure modes

  latency_test:
    concurrency_levels: [1, 5, 10, 25, 50]
    prompt_lengths_tokens: [100, 500, 1000, 5000]
    max_output_tokens: [256, 1024, 4096]
    temperatures: [0.0, 0.3, 0.7, 1.0]
    consistency_runs: 5  # Same prompt N times for consistency score

  timeouts:
    request_timeout_s: 120
    stream_timeout_s: 300

  retry:
    max_retries: 3
    backoff_factor: 2
    retry_on: [429, 500, 502, 503, 504]

  output_dir: results
  evidence_dir: evidence
  raw_results_dir: results/raw
