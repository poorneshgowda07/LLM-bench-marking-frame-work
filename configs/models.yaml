# Model Registry — LLM Benchmarking Framework
# All capability data is manually researched. Mark unsupported features as null.
# Pricing in USD per 1M tokens (as of Sep 2025 — update as needed)

models:

  # ─── OPENAI ───────────────────────────────────────────────────────────────
  gpt-4o:
    provider: openai
    display_name: GPT-4o
    parameters: ~200B
    context_window: 128000
    max_output_tokens: 16384
    multimodal:
      vision: true
      audio: true
    streaming: true
    function_calling: true
    json_mode: true
    reasoning_cot: false
    code_generation: true
    multilingual: true
    fine_tuning: true
    pricing:
      input_per_1m: 2.50
      output_per_1m: 10.00
    deployment:
      api: true
      local: false
    limitations:
      - Knowledge cutoff April 2024
      - No real-time internet access
    api_model_id: gpt-4o

